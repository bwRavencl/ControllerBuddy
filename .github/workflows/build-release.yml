name: Build Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint Markdown Files
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: |
            **/*.md
            !SDL_GameControllerDB/**

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            dist_os: windows
            dist_arch: x86-64
            dist_archive_extension: zip
            gradle_task: distZip
          - os: ubuntu-latest
            dist_os: linux
            dist_arch: x86-64
            dist_archive_extension: tgz
            gradle_task: distTar
          - os: ubuntu-26.04-arm
            dist_os: linux
            dist_arch: aarch64
            dist_archive_extension: tgz
            gradle_task: distTar
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MAVEN_TOKEN_SECRET: ${{ secrets.MAVEN_TOKEN_SECRET }}
    outputs:
      tag_name: ${{ steps.release-variables.outputs.tag_name }}
    steps:
      - name: Setup Gradle Init Script
        run: |
          mkdir -p "$HOME/.gradle"
          cat << 'EOF' > "$HOME/.gradle/init.gradle.kts"
          val mavenBaseUrl = java.net.URI("https://maven.bwravencl.de/")
          val mavenUser = "github"
          val mavenPassword: String = System.getenv("MAVEN_TOKEN_SECRET")
              ?: error("MAVEN_TOKEN_SECRET environment variable is not set")

          fun RepositoryHandler.addRepositories() {
              maven {
                  url = mavenBaseUrl.resolve("releases")
                  credentials {
                      username = mavenUser
                      password = mavenPassword
                  }
                  mavenContent { releasesOnly() }
              }
              maven {
                  url = mavenBaseUrl.resolve("snapshots")
                  credentials {
                      username = mavenUser
                      password = mavenPassword
                  }
                  mavenContent { snapshotsOnly() }
              }
          }

          allprojects {
              buildscript { repositories { addRepositories() } }
              repositories { addRepositories() }
          }
          EOF
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - name: Build Distribution Archive
        uses: ./.github/actions/run-gradle-task
        with:
          task: ${{ matrix.gradle_task }}
      - name: Setup Release Variables
        id: release-variables
        env:
          DIST_ARCHIVE_EXTENSION: ${{ matrix.dist_archive_extension }}
          DIST_OS: ${{ matrix.dist_os }}
          DIST_ARCH: ${{ matrix.dist_arch }}
        run: |
          shopt -s nullglob
          archives=(build/distributions/ControllerBuddy-*."$DIST_ARCHIVE_EXTENSION")
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one archive, found ${#archives[@]}: ${archives[*]}"
            exit 1
          fi
          archive_path=${archives[0]}
          archive_filename=$(basename "$archive_path")
          tag_name=${archive_filename%."$DIST_ARCHIVE_EXTENSION"}
          tag_name=${tag_name#ControllerBuddy-}
          tag_name=${tag_name#"$DIST_OS-$DIST_ARCH-"}
          {
            echo "archive_path=$archive_path"
            echo "archive_filename=$archive_filename"
            echo "tag_name=$tag_name"
          } >> "$GITHUB_OUTPUT"
      - name: Import GPG Key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
      - name: Sign Archive
        id: sign-archive
        env:
          ARCHIVE_PATH: ${{ steps.release-variables.outputs.archive_path }}
          GPG_KEY_ID: ${{ steps.import-gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
        run: |
          signature_path="$ARCHIVE_PATH.sig"
          gpg --batch --yes \
            --local-user "$GPG_KEY_ID" \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --detach-sig \
            --output "$signature_path" \
            "$ARCHIVE_PATH" <<< "$GPG_PASSPHRASE"
          echo "signature_path=$signature_path" >> "$GITHUB_OUTPUT"
      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.release-variables.outputs.archive_filename }}
          path: |
            ${{ steps.release-variables.outputs.archive_path }}
            ${{ steps.sign-archive.outputs.signature_path }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ControllerBuddy-${{ needs.build.outputs.tag_name }}
          tag_name: ${{ needs.build.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
      - name: Trigger Release Monitoring Check
        id: release-monitoring
        env:
          RELEASE_MONITORING_TOKEN: ${{ secrets.RELEASE_MONITORING_TOKEN }}
        run: |
          sleep 20
          response=$(curl -sS -w "\n%{http_code}" https://release-monitoring.org/api/v2/versions/ \
            -H "Authorization: token $RELEASE_MONITORING_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"id": 376393, "dry_run": false}')
          status=$(echo "$response" | tail -n 1)
          echo "$response" | sed '$d'
          echo "http_status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != "200" ]; then
            echo "::warning::Release monitoring returned HTTP $status, skipping Flatpak update check"
          fi
      - name: Trigger Flatpak Update Check
        if: steps.release-monitoring.outputs.http_status == '200'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          repository: bwRavencl/ControllerBuddy-Flatpak
          event-type: new-release
