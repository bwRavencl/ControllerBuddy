name: Run Gradle Task
description: Runs a Gradle build task and captures build report artifacts on failure

inputs:
  task:
    description: The Gradle task to execute
    required: true
  working-directory:
    description: The working directory to run the Gradle task in
    default: .
  upload-artifacts:
    description: Whether to upload build report artifacts on failure
    default: 'true'

runs:
  using: composite
  steps:
    - name: Download JBR
      id: download-jbr
      shell: bash
      env:
        JAVA_VERSION: 25.0.4.1
        JBR_BUILD: 635.75
      run: |
        case "$RUNNER_OS" in
          Linux)   jdk_os=linux ;;
          macOS)   jdk_os=osx ;;
          Windows) jdk_os=windows ;;
          *) echo "::error::Unsupported OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   jdk_arch=x64 ;;
          ARM64) jdk_arch=aarch64 ;;
          *) echo "::error::Unsupported arch: $RUNNER_ARCH"; exit 1 ;;
        esac
        curl -fsSL -o "$RUNNER_TEMP/java_package.tar.gz" "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-$JAVA_VERSION-$jdk_os-$jdk_arch-b$JBR_BUILD.tar.gz"
        echo "java_semver=$(echo "$JAVA_VERSION" | cut -d. -f1-3)" >> "$GITHUB_OUTPUT"
    - name: Install JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
      with:
        distribution: jdkfile
        jdk-file: ${{ runner.temp }}/java_package.tar.gz
        java-version: ${{ steps.download-jbr.outputs.java_semver }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      with:
        cache-disabled: true
    - name: Execute Gradle Task
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GRADLE_OPTS: -Dorg.gradle.daemon=false
        GRADLE_TASK: ${{ inputs.task }}
      run: ./gradlew $GRADLE_TASK --info --non-interactive
    - name: Upload Build-Reports Artifact
      if: failure() && inputs.upload-artifacts == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: build-reports-${{ runner.os }}-${{ runner.arch }}
        path: |
          ${{ inputs.working-directory }}/build/reports/spotbugs
          ${{ inputs.working-directory }}/build/reports/tests
          ${{ inputs.working-directory }}/build/test-results
        if-no-files-found: ignore
